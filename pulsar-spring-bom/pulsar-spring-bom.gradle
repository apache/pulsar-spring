import org.apache.pulsar.spring.gradle.SpringModulePlugin

plugins {
	id 'io.spring.convention.repository'
	id 'org.apache.pulsar.spring.bom'
}

description = 'Spring Pulsar (Bill of Materials)'

dependencies {
	constraints {
		project.rootProject.subprojects
				.sort { "$it.name" }
				.findAll { it.name != "pulsar-spring-bom" }
				.each { p ->
					p.plugins.withType(SpringModulePlugin) {
						api p
					}
				}
	}
}
