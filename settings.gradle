pluginManagement {
	repositories {
		mavenCentral()
		gradlePluginPortal()
		maven {
			url = "https://repository.apache.org/snapshots/"
			mavenContent {
				snapshotsOnly()
			}
		}
	}
}

include 'pulsar-spring'
include 'pulsar-spring-bom'
include 'pulsar-spring-boot-autoconfigure'
include 'pulsar-spring-boot-starter'
include 'pulsar-spring-boot-starter-test'
include 'pulsar-spring-cache-provider'
include 'pulsar-spring-cache-provider-caffeine'
include 'pulsar-spring-cloud-stream-binder'
include 'pulsar-spring-dependencies'
include 'pulsar-spring-docs'
include 'pulsar-spring-test'
include 'pulsar-spring-integration-tests'

rootProject.name = "pulsar-spring-dist"

rootProject.children.each { project -> project.buildFileName = "${project.name}.gradle" }

// The sample apps are a separate build, so that they can also be run against published
// artifacts. Here, dependency substitution makes them use the projects of this build, which
// requires this build to be included as well.
includeBuild('.')
includeBuild('pulsar-spring-sample-apps')
