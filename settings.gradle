pluginManagement {
	repositories {
		mavenCentral()
		gradlePluginPortal()
		maven { url = "https://repository.apache.org/snapshots/" }
	}
}

include 'pulsar-spring'
include 'pulsar-spring-bom'
include 'pulsar-spring-boot-autoconfigure'
include 'pulsar-spring-boot-starter'
include 'pulsar-spring-boot-starter-test'
include 'pulsar-spring-cache-provider'
include 'pulsar-spring-cache-provider-caffeine'
include 'pulsar-spring-cloud-stream-binder'
include 'pulsar-spring-dependencies'
include 'pulsar-spring-sample-apps:sample-imperative-produce-consume'
include 'pulsar-spring-sample-apps:sample-failover-custom-router'
include 'pulsar-spring-sample-apps:sample-pulsar-functions:sample-signup-app'
include 'pulsar-spring-sample-apps:sample-pulsar-functions:sample-signup-function'
include 'pulsar-spring-sample-apps:sample-pulsar-binder'
include 'pulsar-spring-sample-apps:sample-pulsar-reader'
include 'pulsar-spring-docs'
include 'pulsar-spring-test'
include 'pulsar-spring-integration-tests'

rootProject.name = "pulsar-spring-dist"

rootProject.children.findAll { !it.name.startsWith('sample-') }
		.each {project -> project.buildFileName = "${project.name}.gradle" }
