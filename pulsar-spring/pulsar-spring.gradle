plugins {
	id 'org.apache.pulsar.spring.spring-module'
	id 'java-test-fixtures'
	alias(libs.plugins.protobuf)
}

description = 'Apache Pulsar support for Spring - Core'

apply from: '../gradle/proto-conventions.gradle'

dependencies {
	api 'io.micrometer:micrometer-observation'
	api libs.pulsar.client.api
	api libs.pulsar.client.admin.api
	api 'org.springframework:spring-context'
	api 'org.springframework:spring-messaging'
	api 'org.springframework:spring-tx'
	api project(':pulsar-spring-cache-provider')
	implementation project(path: ':pulsar-spring-cache-provider-caffeine', configuration: 'shadow')
	implementation libs.pulsar.client.original
	implementation libs.pulsar.client.admin.original
	// The client uses this for message encryption, but only has it as a compile-only dependency
	runtimeOnly libs.pulsar.client.messagecrypto.bc
	implementation 'com.fasterxml.jackson.core:jackson-core'
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation libs.jspecify
	// Only for the annotations on classes of pulsar-common, which would fail the build with warnings
	compileOnly libs.swagger.annotations
	optional libs.protobuf.java
	optional libs.json.path
	optional 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8'
	optional 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
	optional 'com.fasterxml.jackson.datatype:jackson-datatype-joda'

	testImplementation project(':pulsar-spring-test')
	testImplementation 'io.micrometer:micrometer-observation-test'
	testImplementation 'io.micrometer:micrometer-tracing-bridge-brave'
	testImplementation 'io.micrometer:micrometer-tracing-test'
	testImplementation 'io.micrometer:micrometer-tracing-integration-test'
	testImplementation 'org.assertj:assertj-core'
	testImplementation 'org.awaitility:awaitility'
	testImplementation 'org.hamcrest:hamcrest'
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testImplementation 'org.mockito:mockito-junit-jupiter'
	testImplementation 'org.springframework:spring-test'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-pulsar'

	// Output capture used by PulsarFunctionAdministrationTests
	testImplementation libs.system.lambda
	testRuntimeOnly libs.logback.classic

	// Used by PulsarMixedTransactionTests (Pulsar + DB)
	testImplementation 'org.springframework:spring-jdbc'
	testImplementation "org.testcontainers:testcontainers-mysql"
	testImplementation 'mysql:mysql-connector-java:8.0.33'

	// Used by UserRecordDe/serializer in test fixtures
	testFixturesApi 'com.fasterxml.jackson.core:jackson-databind'
}

// The test fixtures are only for the tests of this project
['testFixturesApiElements', 'testFixturesRuntimeElements'].each {
	components.java.withVariantsFromConfiguration(configurations.getByName(it)) { skip() }
}
