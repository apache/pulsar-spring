//file:noinspection GroovyUnusedAssignment

antora {
	// Without CI, the UI links "Edit this Page" to the local file instead of edit_url
	environment = [CI: 'true']
	playbook = file('src/main/antora/antora-playbook.yml')
	options = ['to-dir' : project.layout.buildDirectory.dir('site').get().toString(), clean: true, fetch: !project.gradle.startParameter.offline, stacktrace: true]
}

tasks.named("generateAntoraYml") {
	asciidocAttributes = project.provider( { generateAttributes() } )
	baseAntoraYmlFile = file('src/main/antora/antora.yml')
	def projectVersion = project.version.toString().replaceAll(/-INTERNAL/, '')
	// The plugin only splits plain X.Y.Z-SNAPSHOT versions, and the Spring Antora extensions
	// cannot parse X.Y.Z-M1-SNAPSHOT, so use X.Y.Z-M1 with a -SNAPSHOT prerelease.
	def milestoneSnapshot = projectVersion ==~ /.*-(M|RC)\d+-SNAPSHOT/
	version = milestoneSnapshot ? projectVersion - '-SNAPSHOT' : projectVersion
	if (milestoneSnapshot) {
		doLast {
			def antoraYml = outputFile.get().asFile
			antoraYml.text = antoraYml.text.replaceFirst(/(?m)^prerelease: .*$/, "prerelease: -SNAPSHOT")
		}
	}
}

def configurationPropertiesMetadata = rootProject.file('pulsar-spring-boot-autoconfigure/build/classes/java/main/META-INF/spring-configuration-metadata.json')
def configurationPropertiesOutputDir = layout.buildDirectory.dir('docs/generated/configuration-properties')

tasks.register('generateConfigurationPropertiesDocs') {
	dependsOn ':pulsar-spring-boot-autoconfigure:compileJava'
	inputs.file(configurationPropertiesMetadata)
	outputs.dir(configurationPropertiesOutputDir)
	doLast {
		def escape = { value -> value.toString().replace('|', '\\|') }
		def properties = new groovy.json.JsonSlurper().parse(configurationPropertiesMetadata).properties
				.sort { it.name }
		def rows = properties.collect { property ->
			def defaultValue = property.defaultValue != null ? "`+${escape(property.defaultValue)}+`" : ''
			"| `+${property.name}+`\n| ${escape(property.description ?: '')}\n| ${defaultValue}\n"
		}
		def outputDir = configurationPropertiesOutputDir.get().asFile
		outputDir.mkdirs()
		new File(outputDir, 'configuration-properties.adoc').text =
				'[cols="4,5,2",options="header"]\n|===\n| Name | Description | Default\n\n' + rows.join('\n') + '|===\n'
	}
}

tasks.create(name: 'createAntoraPartials', type: Sync) {
	from { project(":pulsar-spring-docs").tasks.generateObservabilityDocs.outputs }
	from(tasks.named('generateConfigurationPropertiesDocs'))
	from(configurationPropertiesMetadata)
	into layout.buildDirectory.dir('generated-antora-resources/modules/ROOT/partials')
}

['java', 'kotlin'].each { language ->
	tasks.register("createAntora${language.capitalize()}Examples", Sync) {
		from("src/main/${language}")
		// Pages show the code without the license headers
		eachFile { details ->
			def inHeader = true
			details.filter { line ->
				inHeader = inHeader && !line.startsWith('package ')
				inHeader ? null : line
			}
		}
		into layout.buildDirectory.dir("generated-antora-resources/modules/ROOT/examples/${language}")
	}
}

tasks.create('generateAntoraResources') {
	dependsOn 'createAntoraPartials'
	dependsOn 'createAntoraJavaExamples'
	dependsOn 'createAntoraKotlinExamples'
	dependsOn 'generateAntoraYml'
}

def generateAttributes() {
	def versionCatalog = extensions.getByType(VersionCatalogsExtension).named("libs")
	def springBootVersionForDocs = versionCatalog.findVersion("spring-boot-for-docs").orElseThrow().displayName
	def springFrameworkVersion = versionCatalog.findVersion("spring").orElseThrow().displayName
	def springCloudStreamVersion = versionCatalog.findVersion("spring-cloud-stream").orElseThrow().displayName
	def pulsarClientVersion = versionCatalog.findVersion("pulsar").orElseThrow().displayName
	def pulsarClientVersionFamily = pulsarClientVersion.tokenize(".")[0] + "." + pulsarClientVersion.tokenize(".")[1] + ".x"
	return ['is-snapshot-version': project.version.endsWith("-SNAPSHOT"),
			'pulsar-client-version': pulsarClientVersion ?: 'current',
			'pulsar-client-version-family': pulsarClientVersionFamily ?: 'current',
			'spring-boot-version': springBootVersionForDocs ?: 'current',
			'spring-cloud-stream-version': springCloudStreamVersion ?: 'current',
			'spring-framework-version': springFrameworkVersion ?: 'current',
			'pulsar-spring-version': project.version]
}
