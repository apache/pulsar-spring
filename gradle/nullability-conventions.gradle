def javaProjects = [ 'pulsar-spring',
					 'pulsar-spring-boot-autoconfigure',
					 'pulsar-spring-cache-provider',
					 'pulsar-spring-cache-provider-caffeine',
					 'pulsar-spring-test' ]

allprojects {
	if (!javaProjects.contains(project.name)) {
		return
	}
	apply plugin: 'io.spring.nullability'
}
