# Patch updates only: the versions in gradle/libs.versions.toml follow the Spring Boot
# BOM, and minor and major upgrades are made deliberately.
#
# An update of gradle/actions can only run after its commit is in
# https://github.com/apache/infrastructure-actions/blob/main/approved_patterns.yml

version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # The version of this project that the sample apps use
      - dependency-name: "org.apache.pulsar:pulsar-spring-bom"

  # The sample apps are a separate build, which has its own dependencies in addition to the
  # version catalog of the main build
  - package-ecosystem: gradle
    directory: "/pulsar-spring-sample-apps"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: "org.apache.pulsar:pulsar-spring-bom"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
