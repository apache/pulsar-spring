# Submits the Gradle dependency graph to GitHub, so that Dependabot can raise alerts for
# the transitive dependencies, which it can't find by parsing the build files.
# See https://github.com/gradle/actions/blob/main/docs/dependency-submission.md

name: CI - Gradle Dependency Submission

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-submission:
    name: Dependency Submission
    permissions:
      contents: write # Submit the dependency graph.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the source code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '25'

      - name: Generate and submit the dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Exclude what only runs during the build, so that alerts are about what this
          # project ships and tests with: the Gradle plugins, in the "classpath" configuration
          # and in buildSrc, and the tools that are resolved in the other configurations.
          dependency-graph-exclude-configurations: 'classpath|checkstyle|nohttp.*|(test)?[Kk]otlin.*|protobufToolsLocator_.*|observationDocs'
          dependency-graph-exclude-projects: ':buildSrc'
