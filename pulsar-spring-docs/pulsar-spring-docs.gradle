import org.apache.pulsar.spring.gradle.ProjectUtils

plugins {
	id 'org.apache.pulsar.spring.spring-docs-module'
	alias(libs.plugins.antora)
	alias(libs.plugins.antora.yml)
}

apply from: "${rootDir}/gradle/antora-docs.gradle"

node {
	version = "24.15.0"
}

description = 'Apache Pulsar support for Spring Docs'

configurations {
	observationDocs
}

dependencies {
	api project (':pulsar-spring')
	observationDocs libs.micrometer.docs.gen
}

jar {
	enabled = false
}

javadoc {
	enabled = false
}

javadocJar {
	enabled = false
}

sourcesJar {
	enabled = false
}

task aggregatedJavadoc(type: Javadoc) {
	group = 'Documentation'
	description = 'Generates aggregated Javadoc API documentation.'
	title = "${rootProject.description} ${version} API"

	project.rootProject.gradle.projectsEvaluated {
		Set<Project> publishedProjects = rootProject.subprojects.findAll { it != project}
			.findAll { it.plugins.hasPlugin(JavaPlugin) && it.plugins.hasPlugin(MavenPublishPlugin) }
			.findAll { !it.name.startsWith('sample-') && !it.name.equals('pulsar-spring-test') && !it.name.contains('-starter') }
		dependsOn publishedProjects.javadoc
		source publishedProjects.javadoc.source
		classpath = project.files(publishedProjects.javadoc.classpath)
		destinationDir = project.file "${buildDir}/api"
		options {
			encoding = "UTF-8"
			author = true
			docTitle = "Apache Pulsar support for Spring ${project.version} API"
			windowTitle = "Apache Pulsar support for Spring ${project.version} API"
			overview = 'src/api/overview.html'
			memberLevel = JavadocMemberLevel.PROTECTED
			outputLevel = JavadocOutputLevel.QUIET
			splitIndex = true
			use = true
			addBooleanOption('Xdoclint:syntax', true) // only check syntax with doclint
			links = [
				"https://docs.oracle.com/en/java/javase/17/docs/api/",
				"https://docs.spring.io/spring-framework/docs/current/javadoc-api/"
			]
		}
	}
}

def observationsInputDir = file("${rootDir}/pulsar-spring/src/main/java/org/apache/pulsar/spring/observation").absolutePath
def observationsOutputDir = file("${buildDir}/docs/generated/observation/").absolutePath

task generateObservabilityDocs(type: JavaExec) {
	mainClass = 'io.micrometer.docs.DocsGeneratorCommand'
	inputs.dir(observationsInputDir)
	outputs.dir(observationsOutputDir)
	classpath configurations.observationDocs
	args observationsInputDir, /.+/, observationsOutputDir
}

task docsZip(type: Zip, dependsOn: [':pulsar-spring-docs:antora']) {
	group = 'Distribution'
	archiveClassifier = 'docs'
	description = "Builds docs archive containing api and reference for deployment at static.spring.io/pulsar-spring/docs."
	duplicatesStrategy "fail"
	from(aggregatedJavadoc) {
		into "api"
	}
	from ('build/site') {
		into 'reference/'
	}
}

artifacts {
	archives docsZip
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			artifact docsZip
		}
	}
}

artifactoryPublish {
	publications(publishing.publications.mavenJava)
}

tasks.withType(PublishToMavenRepository).configureEach {
	enabled = ProjectUtils.isSnapshot(project) || project.hasProperty('forceLocalPublish')
}

tasks.withType(PublishToMavenLocal).configureEach {
	enabled = ProjectUtils.isSnapshot(project) || project.hasProperty('forceLocalPublish')
}
