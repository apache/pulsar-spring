antora:
  # The extensions of @springio/antora-extensions, in the same order, without
  # static-page and set-algolia-env, which are specific to Spring's documentation.
  extensions:
    - '@springio/antora-extensions/override-navigation-builder-extension'
    - '@springio/antora-extensions/partial-build-extension'
    - '@antora/atlas-extension'
    - '@springio/antora-extensions/latest-version-extension'
    - '@springio/antora-extensions/inject-collector-cache-config-extension'
    - '@antora/collector-extension'
    - require: '@springio/antora-extensions/root-component-extension'
      root_component_name: 'pulsar'
    - '@springio/antora-extensions/root-attachments-extension'
site:
  title: Apache Pulsar support for Spring
  url: https://pulsar.apache.org/pulsar-spring/reference/
  robots: allow
content:
  sources:
    - url: ./../../../../
      branches: HEAD
      start_path: pulsar-spring-docs/src/main/antora
      worktrees: true
asciidoc:
  attributes:
    hide-uri-scheme: '@'
    tabs-sync-option: '@'
    chomp: 'all'
  extensions:
    - '@asciidoctor/tabs'
    - '@springio/asciidoctor-extensions'
    - '@springio/asciidoctor-extensions/configuration-properties-extension'
    - '@springio/asciidoctor-extensions/javadoc-extension'
  sourcemap: true
urls:
  latest_version_segment_strategy: redirect:to
  latest_version_segment: ''
  redirect_facility: httpd
ui:
  bundle:
    url: https://github.com/spring-io/antora-ui-spring/releases/download/v0.4.18/ui-bundle.zip
    snapshot: true
  supplemental_files: ./ui
runtime:
  log:
    failure_level: warn
    format: pretty
