name: pulsar
version: true
title: Apache Pulsar support for Spring
nav:
  - modules/ROOT/nav.adoc
ext:
  collector:
    run:
      command: gradlew :pulsar-spring-docs:generateAntoraResources
      local: true
    scan:
      dir: pulsar-spring-docs/build/generated-antora-resources
asciidoc:
  attributes:
    listener-class: PulsarListener@
    template-class: PulsarTemplate@
    container-class: ConcurrentPulsarListenerContainerFactory@
