plugins {
	id 'org.apache.pulsar.spring.spring-unpublished-module'
	id 'pulsar-spring.integration-test-conventions'
	alias(libs.plugins.download)
}

description = 'Apache Pulsar support for Spring - Integration Tests'

repositories {
	mavenCentral()
	maven {
		url = 'https://repository.apache.org/snapshots/'
		mavenContent {
			snapshotsOnly()
		}
	}
}

dependencies {
	intTestImplementation libs.pulsar.client.original
	intTestImplementation project(':pulsar-spring')
	intTestImplementation project(':pulsar-spring-test')
	intTestImplementation 'org.awaitility:awaitility'
	intTestImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	intTestImplementation 'org.testcontainers:testcontainers-pulsar'
	intTestImplementation 'org.testcontainers:testcontainers-rabbitmq'
	intTestImplementation libs.spring.boot.starter.test
	intTestImplementation libs.spring.boot.starter.amqp
	intTestImplementation project(':pulsar-spring-boot-starter')
	intTestImplementation libs.spring.boot.testcontainers
	intTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	intTestRuntimeOnly libs.logback.classic
}

test {
	testLogging.showStandardStreams = true
}

integrationTest {
	maxHeapSize = '2048m'
}

def versionCatalog = extensions.getByType(VersionCatalogsExtension).named("libs")
def pulsarVersion = versionCatalog.findVersion("pulsar").orElseThrow().displayName

task downloadRabbitConnector {
	onlyIf {
		System.getProperty("downloadRabbitConnector") == "true"
	}
	doLast {
		try {
			download.run {
				println "Downloading Rabbit connector to 'src/intTest/resources/connectors/' (one time only if not already downloaded)..."
				src "https://archive.apache.org/dist/pulsar/pulsar-${pulsarVersion}/connectors/pulsar-io-rabbitmq-${pulsarVersion}.nar"
				dest "$projectDir/src/intTest/resources/connectors/pulsar-io-rabbitmq-${pulsarVersion}.nar"
				overwrite false
			}
		} catch (Exception ex) {
			println "Failed to download rabbit connector: $ex"
		}
	}
}

project.afterEvaluate {
	integrationTest.dependsOn downloadRabbitConnector
}
