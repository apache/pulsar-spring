plugins {
	id 'org.apache.pulsar.spring.spring-module'
	alias(libs.plugins.shadow)
}

description = 'Apache Pulsar support for Spring - Caffeine Cache Provider'

dependencies {
	api project (':pulsar-spring-cache-provider')
	implementation libs.caffeine
	shadow project(':pulsar-spring-cache-provider')
}

jar {
	archiveClassifier.set('original')
}

tasks.named('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
	archiveClassifier = ''
	from("${rootProject.projectDir}") {
		include 'LICENSE', 'NOTICE'
		into 'META-INF'
	}
	relocate 'com.github.benmanes.caffeine', 'org.apache.pulsar.spring.shade.com.github.benmanes.caffeine'
	relocate 'com.google', 'org.apache.pulsar.spring.shade.com.google'
	dependencies {
		exclude {
			!['com.github.ben-manes.caffeine', 'com.google.errorprone'].contains(it.moduleGroup)
		}
	}
}

// disable module metadata - otherwise original jar will be used when published
tasks.withType(GenerateModuleMetadata) {
	enabled = false
}

shadow {
	addShadowVariantIntoJavaComponent = false
}

publishing {
	publications {
		mavenJava {
			artifact(shadowJar)
			pom.withXml {
				Node pomNode = asNode()
				pomNode.dependencies.'*'.findAll() {
					it.artifactId.text() == 'caffeine'
				}.each() {
					it.parent().remove(it)
				}
			}
		}
	}
}
