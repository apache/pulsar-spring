plugins {
	id "java-gradle-plugin"
	id 'groovy-gradle-plugin'
	id "java"
	id "groovy"
}

repositories {
	mavenCentral()
	gradlePluginPortal()
}

sourceSets {
	main {
		java { srcDirs = [] }
		groovy { srcDirs += ['src/main/java'] }
	}
}

configurations {
	implementation {
		exclude module: 'groovy-all'
	}
}

dependencies {
	implementation localGroovy()
	implementation buildLibs.asciidoc.gradle.jvm
	implementation buildLibs.commons.codec
	implementation buildLibs.commons.compress
	implementation buildLibs.groovy.all
	implementation buildLibs.jfrog.build.extractor.gradle
	implementation buildLibs.jackson.databind
	implementation buildLibs.javaformat.gradle
	implementation buildLibs.maven.embedder
	implementation buildLibs.nexus.publish
	implementation buildLibs.nohttp.gradle
	implementation buildLibs.sonarqube.gradle
	implementation(platform(buildLibs.spring.bom))
	implementation buildLibs.spring.core
	implementation buildLibs.spring.web
	implementation buildLibs.test.retry.gradle
}

gradlePlugin {
	plugins {
		artifactoryPlugin {
			id = "org.apache.pulsar.spring.artifactory"
			implementationClass = "org.apache.pulsar.spring.gradle.convention.ArtifactoryPlugin"
		}
		mavenBomPlugin {
			id = "org.apache.pulsar.spring.bom"
			implementationClass = "org.apache.pulsar.spring.gradle.MavenBomPlugin"
		}
		optionalDependenciesPlugin {
			id = "org.apache.pulsar.spring.optional-dependencies"
			implementationClass = "org.apache.pulsar.spring.gradle.optional.OptionalDependenciesPlugin"
		}
		repositoryConventionPlugin {
			id = "org.apache.pulsar.spring.repository"
			implementationClass = "org.apache.pulsar.spring.gradle.convention.RepositoryConventionPlugin"
		}
		rootProjectPlugin {
			id = "org.apache.pulsar.spring.root-project"
			implementationClass = "org.apache.pulsar.spring.gradle.RootProjectPlugin"
		}
		springDocsModulePlugin {
			id = "org.apache.pulsar.spring.spring-docs-module"
			implementationClass = "org.apache.pulsar.spring.gradle.SpringDocsModulePlugin"
		}
		springModulePlugin {
			id = "org.apache.pulsar.spring.spring-module"
			implementationClass = "org.apache.pulsar.spring.gradle.SpringModulePlugin"
		}
		springUnpublishedModulePlugin {
			id = "org.apache.pulsar.spring.spring-unpublished-module"
			implementationClass = "org.apache.pulsar.spring.gradle.SpringUnpublishedModulePlugin"
		}
		sonarQubeConventionsPlugin {
			id = "org.apache.pulsar.spring.sonarqube"
			implementationClass = "org.apache.pulsar.spring.gradle.check.SonarQubeConventionsPlugin"
		}
		updateProjectVersion {
			id = "org.apache.pulsar.spring.update-version"
			implementationClass = "org.apache.pulsar.spring.gradle.versions.UpdateProjectVersionPlugin"
		}
	}
}
