plugins {
	id 'base'
}

description = 'Apache Pulsar support for Spring Sample Applications'

def toolchainVersion = (findProperty('testToolchain') ?: 25).toString().toInteger()

// The JVM options that the Pulsar client and Netty need. Applications should use these too.
ext.pulsarClientJvmArgs = { JavaVersion javaVersion ->
	def args = [
			'--add-opens', 'java.base/java.nio=ALL-UNNAMED',
			'--add-opens', 'java.base/jdk.internal.misc=ALL-UNNAMED',
			'--add-opens', 'java.base/java.util.zip=ALL-UNNAMED',
			'-Dio.netty.tryReflectionSetAccessible=true'
	]
	// These options don't exist or aren't needed on earlier Java versions
	if (javaVersion.isCompatibleWith(JavaVersion.VERSION_23)) {
		args << '--sun-misc-unsafe-memory-access=allow'
	}
	if (javaVersion.isCompatibleWith(JavaVersion.VERSION_24)) {
		args << '--enable-native-access=ALL-UNNAMED'
	}
	args
}

subprojects {
	group = 'org.apache.pulsar.spring.sample'

	// Spring Boot's dependency management would otherwise use the versions of its own BOM
	ext['pulsar.version'] = rootProject.libs.versions.pulsar.get()
	ext['netty.version'] = rootProject.libs.versions.netty.get()
	ext['opentelemetry.version'] = rootProject.libs.versions.opentelemetry.asProvider().get()
	ext['rabbit-amqp-client.version'] = rootProject.libs.versions.amqp.client.get()

	configurations.configureEach {
		resolutionStrategy {
			cacheChangingModulesFor 0, 'seconds'
			cacheDynamicVersionsFor 0, 'seconds'
		}
	}

	plugins.withId('java') {
		// Newer versions than the dependencies of the sample apps ask for
		dependencies.constraints {
			implementation rootProject.libs.commons.text
			implementation rootProject.libs.guava
		}
		dependencies {
			implementation platform(rootProject.libs.opentelemetry.bom)
			implementation platform(rootProject.libs.opentelemetry.bom.alpha)
		}
		java {
			toolchain {
				languageVersion = JavaLanguageVersion.of(toolchainVersion)
			}
		}
		tasks.withType(JavaCompile).configureEach {
			options.encoding = 'UTF-8'
			options.release = 17
			options.compilerArgs.addAll(['-parameters', '-Xlint:unchecked', '-Xlint:rawtypes', '-Xlint:varargs',
					'-Xlint:deprecation'])
			if (name == 'compileJava') {
				options.compilerArgs.add('-Werror')
			}
		}
		// The bootRun task of the Spring Boot plugin is a JavaExec task
		tasks.withType(JavaExec).configureEach {
			doFirst { JavaExec exec ->
				exec.jvmArgs(rootProject.pulsarClientJvmArgs(exec.javaVersion))
			}
		}
		// Added when the task runs since the test classpath and Java version are task inputs
		// already, and this keeps the absolute path of the Mockito jar out of the inputs.
		tasks.withType(Test).configureEach {
			// PulsarTestImage reads this, so results for another image must not be reused
			inputs.property('pulsarTestImage', providers.environmentVariable('PULSAR_TEST_IMAGE').orElse(''))
			doFirst { Test test ->
				// Mockito can't rely on attaching itself in future JDK releases
				test.classpath.files.findAll { it.name ==~ /mockito-core-.*\.jar/ }.each {
					test.jvmArgs("-javaagent:${it.absolutePath}")
				}
				test.jvmArgs(rootProject.pulsarClientJvmArgs(test.javaVersion))
			}
		}
	}
}

def subprojectTasks = { String taskName ->
	provider { subprojects.collectMany { it.tasks.matching { it.name == taskName }.toList() } }
}

tasks.named('build') {
	dependsOn subprojectTasks('build')
}

tasks.named('clean') {
	dependsOn subprojectTasks('clean')
}

// Run with -PsampleTests, as the tests are otherwise skipped
tasks.register('runAllSampleTests') {
	group = 'verification'
	description = 'Runs the tests of all the sample applications.'
	dependsOn subprojectTasks('test')
}
