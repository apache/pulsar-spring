plugins {
	id 'base'
}

description = 'Apache Pulsar support for Spring Sample Applications'

def toolchainVersion = (findProperty('testToolchain') ?: 25).toString().toInteger()

subprojects {
	group = 'org.apache.pulsar.spring.sample'

	configurations.configureEach {
		resolutionStrategy {
			cacheChangingModulesFor 0, 'seconds'
			cacheDynamicVersionsFor 0, 'seconds'
		}
	}

	plugins.withId('java') {
		java {
			toolchain {
				languageVersion = JavaLanguageVersion.of(toolchainVersion)
			}
		}
		tasks.withType(JavaCompile).configureEach {
			options.encoding = 'UTF-8'
			options.release = 17
			options.compilerArgs.addAll(['-parameters', '-Xlint:unchecked', '-Xlint:rawtypes', '-Xlint:varargs',
					'-Xlint:deprecation'])
			if (name == 'compileJava') {
				options.compilerArgs.add('-Werror')
			}
		}
	}
}

def subprojectTasks = { String taskName ->
	provider { subprojects.collectMany { it.tasks.matching { it.name == taskName }.toList() } }
}

tasks.named('build') {
	dependsOn subprojectTasks('build')
}

tasks.named('clean') {
	dependsOn subprojectTasks('clean')
}

// Run with -PsampleTests, as the tests are otherwise skipped
tasks.register('runAllSampleTests') {
	group = 'verification'
	description = 'Runs the tests of all the sample applications.'
	dependsOn subprojectTasks('test')
}
