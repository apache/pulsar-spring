plugins {
	id 'java'
	alias(libs.plugins.spring.boot)
	alias(libs.plugins.spring.dep.mgmt)
}

description = 'Apache Pulsar support for Spring Sample Application (Reader)'

dependencies {
	implementation platform(libs.pulsar.spring.bom)
	implementation 'org.apache.pulsar:pulsar-spring-boot-starter'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	testImplementation 'org.apache.pulsar:pulsar-spring-test'
	testRuntimeOnly 'ch.qos.logback:logback-classic'
	testImplementation "org.springframework.boot:spring-boot-starter-test"
	testImplementation "org.springframework.boot:spring-boot-testcontainers"
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-pulsar'
}

test {
	onlyIf {
		project.hasProperty("sampleTests")
	}
	useJUnitPlatform()
	testLogging.showStandardStreams = true
	outputs.upToDateWhen { false }
}

bootRun {
	jvmArgs = [
			"--add-opens", "java.base/java.lang=ALL-UNNAMED",
			"--add-opens", "java.base/java.util=ALL-UNNAMED",
			"--add-opens", "java.base/sun.net=ALL-UNNAMED"
	]
	// when run from command line, path must be set relative to module dir
	systemProperty 'spring.docker.compose.file', 'compose.yaml'
}
