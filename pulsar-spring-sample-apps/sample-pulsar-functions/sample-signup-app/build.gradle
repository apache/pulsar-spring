plugins {
	id 'java'
	alias(libs.plugins.spring.boot)
	alias(libs.plugins.spring.dep.mgmt)
}

group = 'org.apache.pulsar.spring.sample'
description = 'Sample Signup App (Pulsar Functions)'

repositories { 
	mavenCentral()
	maven { url 'https://repository.apache.org/snapshots/' }
}

def versionCatalog = extensions.getByType(VersionCatalogsExtension).named("libs")
def pulsarVersion = project.properties['pulsarVersion'] ?: versionCatalog.findVersion("pulsar").orElseThrow().displayName

ext['pulsar.version'] = "${pulsarVersion}"

dependencies {
	implementation project(':pulsar-spring-cloud-stream-binder')
	implementation 'org.springframework.boot:spring-boot-starter-amqp'
	implementation 'org.springframework.boot:spring-boot-starter-data-cassandra'
	implementation 'com.devskiller:jfairy:0.6.5'
}

test {
	onlyIf {
		project.hasProperty("sampleTests")
	}
	useJUnitPlatform()
	testLogging.showStandardStreams = true
	outputs.upToDateWhen { false }
}

bootRun {
	jvmArgs = [
			"--add-opens", "java.base/java.lang=ALL-UNNAMED",
			"--add-opens", "java.base/java.util=ALL-UNNAMED",
			"--add-opens", "java.base/sun.net=ALL-UNNAMED"
	]
}
