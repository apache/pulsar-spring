plugins {
	id 'java'
}

group = 'org.apache.pulsar.spring.sample'
description = 'Sample Signup Pulsar Function'

dependencies {
	// Enforced since Avro in the Pulsar client would otherwise select a newer version
	implementation enforcedPlatform(libs.jackson.bom)
	implementation libs.pulsar.client.original
	implementation "org.apache.pulsar:pulsar-functions-api:${libs.versions.pulsar.asProvider().get()}"
	implementation libs.jspecify
	compileOnly 'org.projectlombok:lombok:1.18.48'
	annotationProcessor 'org.projectlombok:lombok:1.18.48'
}

// Customization of jar to make a simple Uber function jar
jar {
	manifest {
		attributes 'Main-Class': 'org.apache.pulsar.spring.sample.signup.SignupFunction'
	}
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	dependsOn configurations.runtimeClasspath
	from(configurations.runtimeClasspath.findAll { it.name.endsWith('jar') }.collect { zipTree(it) }) {
		exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
	}
}
