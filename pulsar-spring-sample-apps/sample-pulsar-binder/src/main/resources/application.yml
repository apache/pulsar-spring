spring:
  cloud:
    function:
      definition: fooProcessor;barLogger
    stream:
      output-bindings: fooSupplier-out-0
      bindings:
        fooSupplier-out-0:
          producer:
            use-native-encoding: true
        fooProcessor-in-0:
          destination: fooSupplier-out-0
          consumer:
            use-native-decoding: true
        fooProcessor-out-0:
          destination: fooProcessor-out-0
          producer:
            use-native-encoding: true
        barLogger-in-0:
          destination: fooProcessor-out-0
          consumer:
            use-native-decoding: true
      pulsar:
        bindings:
          fooSupplier-out-0:
            producer:
              schema-type: JSON
              message-type: org.apache.pulsar.spring.sample.binder.PulsarSpringBinderSampleApp.Foo
          fooProcessor-in-0:
            consumer:
              schema-type: JSON
              message-type: org.apache.pulsar.spring.sample.binder.PulsarSpringBinderSampleApp.Foo
          fooProcessor-out-0:
            producer:
              schema-type: JSON
              message-type: org.apache.pulsar.spring.sample.binder.PulsarSpringBinderSampleApp.Bar
          barLogger-in-0:
            consumer:
              schema-type: JSON
              message-type: org.apache.pulsar.spring.sample.binder.PulsarSpringBinderSampleApp.Bar
  docker:
    compose:
      # when run from Intellij via "Run" button, path must be set from project root
      file: pulsar-spring-sample-apps/sample-pulsar-binder/compose.yaml
