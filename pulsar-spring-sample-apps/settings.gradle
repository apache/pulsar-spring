pluginManagement {
	repositories {
		mavenCentral()
		gradlePluginPortal()
		maven {
			url = 'https://repository.apache.org/snapshots/'
			mavenContent {
				snapshotsOnly()
			}
		}
	}
}

// When this build is run on its own, the sample apps get the Apache Pulsar support for Spring
// artifacts from the repository in the pulsarSpringRepository property (a path or a URL), if
// it's set, and otherwise from the repositories below. The main build includes this build and
// substitutes its projects for these artifacts.
def pulsarSpringRepository = providers.gradleProperty('pulsarSpringRepository').orNull

// This build uses the group and version of the main build, which aren't available to it as properties
def mainBuildProperties = new Properties()
mainBuildProperties.load(new StringReader(
		providers.fileContents(layout.settingsDirectory.file('../gradle.properties')).asText.get()))
def pulsarSpringGroup = mainBuildProperties.getProperty('group')

dependencyResolutionManagement {
	repositories {
		if (pulsarSpringRepository != null) {
			exclusiveContent {
				forRepository {
					maven {
						url = pulsarSpringRepository.contains('://') ? uri(pulsarSpringRepository)
								: new File(settingsDir, pulsarSpringRepository).toURI()
					}
				}
				filter {
					includeModuleByRegex(java.util.regex.Pattern.quote(pulsarSpringGroup), 'pulsar-spring.*')
				}
			}
		}
		mavenCentral()
		maven {
			url = 'https://repository.apache.org/snapshots/'
			mavenContent {
				snapshotsOnly()
			}
		}
	}
	versionCatalogs {
		libs {
			from(files('../gradle/libs.versions.toml'))
			library('pulsar-spring-bom', pulsarSpringGroup, 'pulsar-spring-bom')
				.version(mainBuildProperties.getProperty('version'))
			// The BOM manages the versions of these
			library('pulsar-spring-boot-starter', pulsarSpringGroup, 'pulsar-spring-boot-starter').withoutVersion()
			library('pulsar-spring-cloud-stream-binder', pulsarSpringGroup, 'pulsar-spring-cloud-stream-binder').withoutVersion()
			library('pulsar-spring-test', pulsarSpringGroup, 'pulsar-spring-test').withoutVersion()
		}
	}
}

rootProject.name = 'pulsar-spring-sample-apps'

include 'sample-imperative-produce-consume'
include 'sample-failover-custom-router'
include 'sample-pulsar-functions:sample-signup-app'
include 'sample-pulsar-functions:sample-signup-function'
include 'sample-pulsar-binder'
include 'sample-pulsar-reader'
include 'sample-native-image'
