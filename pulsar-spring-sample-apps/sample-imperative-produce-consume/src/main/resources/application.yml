spring:
  pulsar:
    defaults:
      type-mappings:
        - message-type: org.apache.pulsar.spring.sample.imperative.ImperativeProduceAndConsumeApp$Bar
          topic-name: bar-topic
          schema-info:
            schema-type: JSON
  docker:
    compose:
      # when run from Intellij via "Run" button, path must be set from project root
      file: pulsar-spring-sample-apps/sample-imperative-produce-consume/compose.yaml
