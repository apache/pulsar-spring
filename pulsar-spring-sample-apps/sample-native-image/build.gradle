plugins {
	id 'java'
	alias(libs.plugins.spring.boot)
	alias(libs.plugins.spring.dep.mgmt)
	alias(libs.plugins.native.build.tools)
}

description = 'Apache Pulsar support for Spring Sample Application (AOT and native image)'

dependencies {
	implementation platform(libs.pulsar.spring.bom)
	implementation 'org.apache.pulsar:pulsar-spring-boot-starter'
	testImplementation 'org.apache.pulsar:pulsar-spring-test'
	testRuntimeOnly 'ch.qos.logback:logback-classic'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-pulsar'
}

// The tests start the application as a separate process with this command, one argument per line.
test {
	onlyIf {
		project.hasProperty('sampleTests')
	}
	useJUnitPlatform()
	testLogging.showStandardStreams = true
	outputs.upToDateWhen { false }
	dependsOn tasks.named('bootJar')
	doFirst {
		def jvmArgs = rootProject.pulsarClientJvmArgs(javaVersion) + ['-Dspring.aot.enabled=true', '-jar',
				tasks.bootJar.archiveFile.get().asFile]
		systemProperty 'sample.command', ([javaLauncher.get().executablePath] + jvmArgs).join('\n')
	}
}

// Requires GraalVM, which is found through the GRAALVM_HOME or JAVA_HOME environment variable.
tasks.register('nativeSmokeTest', Test) {
	description = 'Runs the tests with the application as a native image.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	testLogging.showStandardStreams = true
	outputs.upToDateWhen { false }
	dependsOn tasks.named('nativeCompile')
	doFirst {
		systemProperty 'sample.command', tasks.nativeCompile.outputFile.get().asFile.path
	}
}
