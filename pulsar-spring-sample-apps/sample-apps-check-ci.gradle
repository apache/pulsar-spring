settingsEvaluated { settings ->
	settings.pluginManagement {
		repositories {
			mavenCentral()
			gradlePluginPortal()
			maven { url = "https://repository.apache.org/snapshots/" }
		}
		resolutionStrategy {
			eachPlugin {
				if (requested.id.id == "org.springframework.boot") {
					useVersion("$rootProject.springBootVersion")
				}
			}
		}
	}
}

allprojects {
	configurations.all {
		resolutionStrategy {
			force "org.apache.pulsar:pulsar-spring:$pulsarSpringVersion"
			force "org.apache.pulsar:pulsar-spring-cache-provider:$pulsarSpringVersion"
			force "org.apache.pulsar:pulsar-spring-cache-provider-caffeine:$pulsarSpringVersion"
			force "org.apache.pulsar:pulsar-spring-dependencies:$pulsarSpringVersion"
		}
	}
	repositories {
		exclusiveContent {
			forRepository {
				maven {
					url = "file://$localRepositoryPath"
				}
			}
			filter {
				includeVersion "org.apache.pulsar", "pulsar-spring", "$pulsarSpringVersion"
				includeVersion "org.apache.pulsar", "pulsar-spring-cache-provider", "$pulsarSpringVersion"
				includeVersion "org.apache.pulsar", "pulsar-spring-cache-provider-caffeine", "$pulsarSpringVersion"
				includeVersion "org.apache.pulsar", "pulsar-spring-dependencies", "$pulsarSpringVersion"
			}
		}
	}
}
