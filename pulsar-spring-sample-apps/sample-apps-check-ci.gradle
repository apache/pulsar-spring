settingsEvaluated { settings ->
	settings.pluginManagement {
		repositories {
			mavenCentral()
			gradlePluginPortal()
			maven { url "https://repo.spring.io/milestone" }
			maven { url "https://repo.spring.io/snapshot" }
		}
		resolutionStrategy {
			eachPlugin {
				if (requested.id.id == "org.springframework.boot") {
					useVersion("$rootProject.springBootVersion")
				}
			}
		}
	}
}

allprojects {
	configurations.all {
		resolutionStrategy {
			force "org.apache.pulsar:pulsar-spring:$springPulsarVersion"
			force "org.apache.pulsar:pulsar-spring-cache-provider:$springPulsarVersion"
			force "org.apache.pulsar:pulsar-spring-cache-provider-caffeine:$springPulsarVersion"
			force "org.apache.pulsar:pulsar-spring-dependencies:$springPulsarVersion"
		}
	}
	repositories {
		exclusiveContent {
			forRepository {
				maven {
					url "file://$localRepositoryPath"
				}
			}
			filter {
				includeVersion "org.apache.pulsar", "pulsar-spring", "$springPulsarVersion"
				includeVersion "org.apache.pulsar", "pulsar-spring-cache-provider", "$springPulsarVersion"
				includeVersion "org.apache.pulsar", "pulsar-spring-cache-provider-caffeine", "$springPulsarVersion"
				includeVersion "org.apache.pulsar", "pulsar-spring-dependencies", "$springPulsarVersion"
			}
		}
	}
}
