plugins {
	id 'java-platform'
	id 'org.apache.pulsar.spring.repository'
}

javaPlatform {
	allowDependencies()
}

dependencies {
	// Enforced since Avro in the Pulsar client would otherwise select a newer version
	api enforcedPlatform(libs.jackson.bom)
	api platform(libs.micrometer.bom)
	api platform(libs.micrometer.tracing.bom)
	api platform(libs.netty.bom)
	api platform(libs.assertj.bom)
	api platform(libs.awaitility)
	api platform(libs.junit.bom)
	api platform(libs.mockito.bom)
	api platform(libs.spring.bom)
	api platform(libs.testcontainers.bom)

	constraints {
		api libs.amqp.client
		api libs.logback.classic
		api libs.caffeine
		api libs.jspecify
		api libs.protobuf.java
		api libs.json.path
		api libs.micrometer.docs.gen
		api libs.pulsar.client.admin.api
		api libs.pulsar.client.admin.original
		api libs.pulsar.client.api
		api libs.pulsar.client.messagecrypto.bc
		api libs.pulsar.client.original
		api libs.system.lambda
	}
}
