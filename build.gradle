buildscript {
	ext.isCI = System.getenv('GITHUB_ACTION')
}

plugins {
	id 'io.spring.nohttp'
	id 'org.apache.pulsar.spring.root-project'
	id 'org.apache.pulsar.spring.update-version'
	alias(libs.plugins.rat)
	alias(libs.plugins.versions)
	alias(libs.plugins.version.catalog.update)
	id 'io.spring.nullability' version '0.0.18' apply false
}

description = 'Apache Pulsar support for Spring'

apply from: 'gradle/version-catalog-update.gradle'
apply from: 'gradle/java-conventions.gradle'
apply from: 'gradle/nullability-conventions.gradle'
apply from: 'gradle/source-release.gradle'

allprojects {
	group = 'org.apache.pulsar'
	configurations.all {
		resolutionStrategy {
			cacheChangingModulesFor 0, "seconds"
			cacheDynamicVersionsFor 0, "seconds"
		}
	}
}

nohttp {
	allowlistFile = project.file('src/nohttp/allowlist.lines')
	source.exclude "**/bin/**"
	source.exclude "**/build/**"
	source.exclude "**/out/**"
	source.exclude "**/target/**"
	source.exclude "**/*.dylib"
	source.exclude "**/*.gif"
	source.exclude "**/.gradle/**"
	source.exclude "**/node_modules/**"
}

// The source of this task is the root directory, which contains the npm install output
checkstyleNohttp {
	mustRunAfter ':pulsar-spring-docs:npmCiOrInstall'
}

// Apache Release Audit Tool: checks that files have an approved license header
rat {
	excludes = rootProject.file('.ratignore').readLines()*.trim().findAll { it && !it.startsWith('#') }
}

check {
	dependsOn checkstyleNohttp
	dependsOn 'rat'
}

def sampleApps = gradle.includedBuild('pulsar-spring-sample-apps')

tasks.named('build') {
	dependsOn sampleApps.task(':build')
}

tasks.named('clean') {
	dependsOn sampleApps.task(':clean')
}

tasks.register('runAllSampleTests') {
	dependsOn sampleApps.task(':runAllSampleTests')
}

versionCatalogUpdate {
	versionCatalogs {
		buildLibsCatalog {
			catalogFile = file("gradle/build-libs.versions.toml")
		}
	}
}
